apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: calendly-api-hpa
  namespace: calendly

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: calendly-api

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
